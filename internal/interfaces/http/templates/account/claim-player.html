<div class="max-w-lg mx-auto animate-fade-in text-white/90">
    {{template "partials/account-nav" .}}

    <h1 class="text-2xl font-extrabold uppercase tracking-tighter mb-2">{{.Title}}</h1>
    <p class="text-gray-400 text-sm mb-6">{{t .T "account.claim.subtitle"}}</p>

    <div class="glass rounded-3xl border border-white/10 p-6">
        <input type="text" name="q" placeholder="{{t .T "account.claim.search_ph"}}"
            hx-get="/account/players/claim/search"
            hx-trigger="keyup changed delay:300ms"
            hx-target="#claim-search-results"
            class="w-full bg-black/40 border border-white/5 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-white mb-4">
        <div id="claim-search-results" class="space-y-2"></div>
    </div>
</div>
