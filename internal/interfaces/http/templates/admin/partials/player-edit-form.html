<h2 class="text-2xl font-extrabold uppercase mb-8 tracking-tighter">{{t .T "admin.common.edit"}} <span class="text-white">{{t .T "admin.player_form.athlete_word"}}</span>.</h2>

<form hx-put="/players/{{.Player.ID}}" hx-encoding="multipart/form-data" hx-target="#player-{{.Player.ID}}" hx-swap="outerHTML" class="space-y-4" hx-on::after-request="if(event.target === this && event.detail.successful) document.getElementById('edit-player-modal').classList.add('hidden')">
    <div class="grid grid-cols-2 gap-4">
        <div class="space-y-1">
            <label class="text-[10px] font-bold uppercase text-gray-500 tracking-widest">{{t .T "register.first_name"}}</label>
            <input type="text" name="firstName" value="{{.Player.FirstName}}" required class="w-full bg-black/40 border border-white/5 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-white">
        </div>
        <div class="space-y-1">
            <label class="text-[10px] font-bold uppercase text-gray-500 tracking-widest">{{t .T "admin.player_form.second_name"}}</label>
            <input type="text" name="secondName" value="{{.Player.SecondName}}" class="w-full bg-black/40 border border-white/5 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-white">
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
        <div class="space-y-1">
            <label class="text-[10px] font-bold uppercase text-gray-500 tracking-widest">{{t .T "register.last_name"}}</label>
            <input type="text" name="lastName" value="{{.Player.LastName}}" required class="w-full bg-black/40 border border-white/5 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-white">
        </div>
        <div class="space-y-1">
            <label class="text-[10px] font-bold uppercase text-gray-500 tracking-widest">{{t .T "admin.player_form.second_last_name"}}</label>
            <input type="text" name="secondLastName" value="{{.Player.SecondLastName}}" class="w-full bg-black/40 border border-white/5 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-white">
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
        <div class="space-y-1">
            <label class="text-[10px] font-bold uppercase text-gray-500 tracking-widest">{{t .T "register.birthdate"}}</label>
            <input type="date" name="birthdate" value="{{.Player.Birthdate.Format "2006-01-02"}}" required class="w-full bg-black/40 border border-white/5 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-white [color-scheme:dark]">
        </div>
        <div class="space-y-1">
            <label class="text-[10px] font-bold uppercase text-gray-500 tracking-widest">{{t .T "register.gender"}}</label>
            <select name="gender" class="w-full bg-black/40 border border-white/5 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-white">
                <option value="M" {{if eq .Player.Gender "M"}}selected{{end}}>{{t .T "register.gender_male"}}</option>
                <option value="F" {{if eq .Player.Gender "F"}}selected{{end}}>{{t .T "register.gender_female"}}</option>
            </select>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
        <div class="space-y-1">
            <label class="text-[10px] font-bold uppercase text-gray-500 tracking-widest">{{t .T "admin.player_form.nationality"}}</label>
            <select id="edit-country" name="country" required
                    hx-get="/players/department-input?theme=admin-edit"
                    hx-trigger="change"
                    hx-target="#edit-department-container"
                    hx-swap="innerHTML"
                    class="w-full bg-black/40 border border-white/5 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-white appearance-none cursor-pointer">
                {{$currentCountry := .Player.Country}}
                {{range countries}}
                    <option value="{{.Code}}" {{if eq .Code $currentCountry}}selected{{end}}>{{.Name}} ({{.Code}})</option>
                {{end}}
            </select>
        </div>
        <div class="space-y-1" id="edit-department-container">
            {{template "partials/department-input" dict "Theme" "admin-edit" "Country" .Player.Country "Department" .Player.Department}}
        </div>
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div class="space-y-1">
            <label class="text-[10px] font-bold uppercase text-gray-500 tracking-widest">{{t .T "admin.player_form.whatsapp"}}</label>
            <input type="text" name="whatsAppNumber" value="{{.Player.WhatsAppNumber}}" placeholder="{{t .T "admin.player_form.whatsapp_ph"}}" class="w-full bg-black/40 border border-white/5 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-white">
        </div>
        <div class="space-y-1">
            <label class="text-[10px] font-bold uppercase text-gray-500 tracking-widest">{{t .T "admin.player_form.national_id"}}</label>
            <input type="text" name="nationalID" value="{{.Player.NationalID}}" placeholder="{{t .T "admin.player_form.national_id_ph"}}" class="w-full bg-black/40 border border-white/5 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-white">
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4 pt-2 border-t border-white/5 mt-4">
        <div class="space-y-1">
            <label class="text-[10px] font-bold uppercase text-gray-500 tracking-widest">{{t .T "admin.common.singles_elo"}}</label>
            <input type="number" name="singlesElo" value="{{.Player.SinglesElo}}" class="w-full bg-black/40 border border-white/5 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-white">
        </div>
        <div class="space-y-1">
            <label class="text-[10px] font-bold uppercase text-gray-500 tracking-widest">{{t .T "admin.common.doubles_elo"}}</label>
            <input type="number" name="doublesElo" value="{{.Player.DoublesElo}}" class="w-full bg-black/40 border border-white/5 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-white">
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4 pt-2 border-t border-white/5 mt-4">
        <div class="space-y-1">
            <label class="text-[10px] font-bold uppercase text-gray-500 tracking-widest">{{t .T "admin.player_form.id_front"}}</label>
            <img src="{{.IDFrontURL}}" class="w-full h-28 object-cover rounded-xl border border-white/5 {{if not .IDFrontURL}}hidden{{end}}">
            <input type="file" name="id_front" accept="image/*" onchange="this.previousElementSibling.src = URL.createObjectURL(this.files[0]); this.previousElementSibling.classList.remove('hidden')" class="w-full bg-black/40 border border-white/5 rounded-xl p-2 text-xs text-white file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:bg-white/10 file:text-white">
        </div>
        <div class="space-y-1">
            <label class="text-[10px] font-bold uppercase text-gray-500 tracking-widest">{{t .T "admin.player_form.id_back"}}</label>
            <img src="{{.IDBackURL}}" class="w-full h-28 object-cover rounded-xl border border-white/5 {{if not .IDBackURL}}hidden{{end}}">
            <input type="file" name="id_back" accept="image/*" onchange="this.previousElementSibling.src = URL.createObjectURL(this.files[0]); this.previousElementSibling.classList.remove('hidden')" class="w-full bg-black/40 border border-white/5 rounded-xl p-2 text-xs text-white file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:bg-white/10 file:text-white">
        </div>
    </div>

    <div class="pt-2 border-t border-white/5 mt-4 space-y-2">
        <label class="text-[10px] font-bold uppercase text-gray-500 mb-1 block">{{t .T "admin.player_form.link_account_label"}}</label>
        {{if .Player.GuardianAccountID}}
        <div class="flex items-center justify-between gap-2 bg-black/40 border border-white/5 rounded-xl p-3">
            <span class="text-xs text-gray-400">{{t .T "admin.player_form.linked_badge"}}</span>
            <button type="button"
                hx-post="/players/{{.Player.ID}}/unlink-account"
                hx-target="#player-{{.Player.ID}}"
                hx-swap="outerHTML"
                class="text-[10px] font-bold uppercase tracking-widest text-red-400 hover:text-red-300">
                {{t .T "admin.player_form.unlink_btn"}}
            </button>
        </div>
        {{else}}
        <div class="flex gap-2">
            <input type="email" name="email" id="link-account-email-{{.Player.ID}}" placeholder="{{t .T "admin.player_form.link_account_ph"}}" class="flex-1 bg-black/40 border border-white/5 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-white">
            <button type="button"
                hx-post="/players/{{.Player.ID}}/link-account"
                hx-include="#link-account-email-{{.Player.ID}}"
                hx-target="#player-{{.Player.ID}}"
                hx-swap="outerHTML"
                class="shrink-0 bg-white/10 hover:bg-white/20 text-white font-bold py-2 px-4 rounded-xl transition-all uppercase tracking-widest text-[10px]">
                {{t .T "admin.player_form.link_btn"}}
            </button>
        </div>
        {{end}}
    </div>

    <div class="pt-2 border-t border-white/5 mt-4">
        <label class="text-[10px] font-bold uppercase text-gray-500 mb-1 block">{{t .T "admin.player_form.enroll_label"}}</label>
        <select name="tournamentId" class="w-full bg-black/40 border border-white/5 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-1 focus:ring-white appearance-none cursor-pointer">
            <option value="">{{t .T "admin.player_form.no_enroll"}}</option>
            {{range .Events}}
                <option value="{{.ID}}">{{.Name}}</option>
            {{end}}
        </select>
    </div>

    <div class="flex gap-3 pt-6">
        <button type="button" hx-on:click="document.getElementById('edit-player-modal').classList.add('hidden')" class="flex-1 border border-white/10 hover:border-white/20 text-gray-400 font-bold py-4 rounded-2xl transition-all uppercase tracking-widest text-xs">{{t .T "score_form.cancel"}}</button>
        <button type="submit" class="flex-2 bg-white hover:bg-gray-200 text-black font-extrabold py-4 px-8 rounded-2xl transition-all uppercase tracking-widest text-xs shadow-lg">{{t .T "admin.player_form.save"}}</button>
    </div>
</form>
