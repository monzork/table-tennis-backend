{{define "admin/partials/board-submatches"}}
{{if .SubMatches}}
<div class="space-y-1 border-l-2 border-white/10 pl-3">
  {{range .SubMatches}}
  <div class="flex items-center gap-2 text-[11px] bg-black/20 rounded-lg px-2 py-1{{if eq .Status "in_progress"}} ring-1 ring-yellow-400/40{{else if eq .Status "scheduled"}} opacity-50{{end}}">
    <span class="font-black uppercase tracking-widest text-gray-500 font-mono w-14 shrink-0">M{{.Number}}{{if .IsDoubles}} <span class="text-blue-400">D</span>{{end}}</span>
    <span class="truncate flex-1 {{if gt .ScoreA .ScoreB}}text-green-400 font-bold{{else}}text-gray-300{{end}}">{{.PlayerAName}}</span>
    <span class="font-black tabular-nums {{if eq .Status "in_progress"}}text-yellow-400{{else}}text-white{{end}}">{{.ScoreA}}-{{.ScoreB}}</span>
    <span class="truncate flex-1 text-right {{if gt .ScoreB .ScoreA}}text-green-400 font-bold{{else}}text-gray-300{{end}}">{{.PlayerBName}}</span>
  </div>
  {{end}}
</div>
{{end}}
{{end}}
