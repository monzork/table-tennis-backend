<!-- Single Table -->
<div class="glass rounded-2xl sm:rounded-3xl overflow-hidden overflow-x-auto border border-white/10 shadow-2xl relative">
    <div class="absolute inset-0 bg-gradient-to-b from-white/3 to-transparent pointer-tournaments-none"></div>
    <table class="w-full text-left border-collapse relative z-10">
        <thead class="hidden sm:table-header-group">
            <tr class="bg-black/60 border-b border-white/15">
                <th class="py-6 px-4 font-bold text-gray-300 uppercase text-xs tracking-widest w-24 text-center">{{t .T "rankings.col_rank"}}</th>
                <th class="py-6 px-4 font-bold text-gray-300 uppercase text-xs tracking-widest">{{t .T "rankings.col_player"}}</th>
                <th class="py-6 px-4 font-bold text-gray-300 uppercase text-xs tracking-widest text-center">{{t .T "rankings.col_assoc"}}</th>
                <th class="py-6 px-4 font-bold text-gray-300 uppercase text-xs tracking-widest text-right pr-8">{{t .T "rankings.col_points"}}</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-white/5">
            {{template "partials/rankings-table" dict "Groups" .Groups "RankType" .RankType "IsDivisional" .IsDivisional "ShowInactive" .ShowInactive "T" .T}}
        </tbody>
    </table>
</div>
